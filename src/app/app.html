<div class="flex min-h-dvh flex-col bg-tabuleiro text-slate-100">
  <header class="border-b border-tabuleiro-borda bg-slate-900">
    <div class="mx-auto flex w-full max-w-6xl items-center gap-2 px-4 py-2">
      <svg lucideAnchor aria-hidden="true" class="h-6 w-6 shrink-0 text-acerto"></svg>
      <div class="flex flex-col">
        <h1 class="text-lg font-bold tracking-tight sm:text-xl">
          {{ titulo() }}
        </h1>
        <p class="text-xs text-slate-300 sm:text-sm">Posicione sua frota e derrote o computador.</p>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
    @switch (store.fase()) {
      @case ('apresentacao') {
        <app-apresentacao />
      }
      @case ('preparacao') {
        <app-preparacao />
      }
      @case ('batalha') {
        <app-batalha />
      }
    }
  </main>

  <footer class="border-t border-tabuleiro-borda px-4 py-4 text-center text-xs text-slate-400">
    Projeto acadêmico desenvolvido com Angular
  </footer>
</div>
